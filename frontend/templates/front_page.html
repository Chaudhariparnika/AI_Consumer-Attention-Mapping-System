<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>AI Consumer Attention Mapping</title>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-6 py-12">
        <div class="relative w-full max-w-4xl overflow-hidden rounded-[2rem] bg-gradient-to-br from-slate-50 via-white to-slate-100 shadow-2xl shadow-slate-300/30">
            <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(56,189,248,0.18),transparent_24%),radial-gradient(circle_at_bottom_right,rgba(15,23,42,0.08),transparent_20%)]"></div>
            <div class="relative flex flex-col gap-10 px-8 py-10 md:px-14 md:py-14">
                <div class="text-center">
                    <p class="text-sm uppercase tracking-[0.3em] text-slate-500 mb-4">Welcome to</p>
                    <h1 class="text-4xl font-semibold tracking-tight text-slate-950 sm:text-5xl">AI Consumer Attention Mapping</h1>
                    <p class="mx-auto mt-4 max-w-2xl text-base leading-7 text-slate-600">Analyze customer engagement and gain insights with a modern, intuitive interface built for teams, businesses, and decision-makers.</p>
                </div>
                <div class="grid gap-6 md:grid-cols-2">
                    <div class="rounded-[1.75rem] border border-slate-200/80 bg-white/90 p-7 shadow-sm shadow-slate-200 transition duration-300 hover:-translate-y-1 hover:shadow-lg">
                        <div class="mb-6 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-sky-600">Admin</p>
                                <h2 class="mt-3 text-xl font-semibold text-slate-900">Manage users and analytics</h2>
                            </div>
                            <span class="inline-flex h-12 w-12 items-center justify-center rounded-3xl bg-sky-50 text-sky-600">A</span>
                        </div>
                        <div class="space-y-4">
                            <a href="/login" class="block rounded-3xl bg-slate-900 px-5 py-3 text-center text-sm font-semibold text-white shadow-lg shadow-slate-900/10 transition duration-300 hover:bg-slate-800">Login</a>
                            <a href="/register" class="block rounded-3xl border border-slate-200 bg-white px-5 py-3 text-center text-sm font-semibold text-slate-900 transition duration-300 hover:border-slate-300 hover:bg-slate-50">Register</a>
                        </div>
                    </div>
                    <div class="rounded-[1.75rem] border border-slate-200/80 bg-white/90 p-7 shadow-sm shadow-slate-200 transition duration-300 hover:-translate-y-1 hover:shadow-lg">
                        <div class="mb-6 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">User</p>
                                <h2 class="mt-3 text-xl font-semibold text-slate-900">Access insights and reports</h2>
                            </div>
                            <span class="inline-flex h-12 w-12 items-center justify-center rounded-3xl bg-emerald-50 text-emerald-600">U</span>
                        </div>
                        <div class="space-y-4">
                            <a href="/login" class="block rounded-3xl bg-slate-900 px-5 py-3 text-center text-sm font-semibold text-white shadow-lg shadow-slate-900/10 transition duration-300 hover:bg-slate-800">Login</a>
                            <a href="/register" class="block rounded-3xl border border-slate-200 bg-white px-5 py-3 text-center text-sm font-semibold text-slate-900 transition duration-300 hover:border-slate-300 hover:bg-slate-50">Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
