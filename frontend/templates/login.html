<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AI Consumer Attention Mapping System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="  min-h-screen">

<div class="h-screen flex justify-center items-center px-4 sm:px-6 lg:px-8">

<form class="w-full max-w-md">

<!-- Glassmorphism Card -->
<div class="backdrop-blur bg-[radial-gradient(circle_at_top_left,rgba(56,189,248,0.18),transparent_24%),radial-gradient(circle_at_bottom_right,rgba(15,23,42,0.08),transparent_20%)] p-8 sm:p-12 rounded-2xl shadow-lg">

<div class="mb-8 text-center">
<div class="flex justify-center mb-4">
<div class="bg-gradient-to-br from-blue-400 to-cyan-400 p-3 rounded-xl">
<i class="fas fa-lock text-white text-2xl"></i>
</div>
</div>
<h1 class="text-4xl font-bold text-slate-900 mb-2">
Welcome Back
</h1>
<p class="text-gray-700 text-sm">Sign in to your AI Consumer Attention account</p>
</div>

<div class="mb-6 space-y-1">
<label class="block text-gray-800 font-semibold text-sm mb-3 flex items-center">
<i class="fas fa-envelope text-blue-400 mr-2"></i>Email Address
</label>
<input
type="email"
name="email"
placeholder="Enter your email"
class="border border-slate-200 bg-white w-full px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-300 text-slate-900 placeholder-gray-500">
</div>

<div class="mb-6 space-y-1">
<label class="block text-gray-800 font-semibold text-sm mb-3 flex items-center">
<i class="fas fa-key text-blue-400 mr-2"></i>Password
</label>
<input
type="password"
name="password"
placeholder="Enter your password"
class="border border-slate-200 bg-white w-full px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-300 text-slate-900 placeholder-gray-500">
</div>

<button
type="submit"
class="bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold w-full py-3 rounded-xl transition duration-300 shadow flex items-center justify-center gap-2">
<i class="fas fa-sign-in-alt"></i>Sign In
</button>

<div class="mt-6 text-center">
<a href="#" class="text-blue-600 hover:text-blue-800 text-sm font-medium transition duration-200 inline-flex items-center gap-1">
<i class="fas fa-question-circle text-xs"></i>Forgot your password?
</a>
</div>

</div>

</form>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
