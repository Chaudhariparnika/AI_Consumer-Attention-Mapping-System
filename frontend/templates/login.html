<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AI Consumer Attention Mapping System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

<div class="h-screen flex justify-center items-center px-4">

<form class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">

<div class="mb-8">
<h1 class="text-4xl font-bold text-center text-gray-800">
Login
</h1>
<p class="text-center text-gray-500 text-sm mt-2">Sign in to your account</p>
</div>

<div class="mb-5">
<label class="block text-gray-700 font-semibold mb-2">Email Address</label>
<input
type="email"
  placeholder="Enter your email"
class="border border-gray-300 w-full px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
</div>

<div class="mb-6">
<label class="block text-gray-700 font-semibold mb-2">Password</label>
<input
type="password"
placeholder="Enter your password"
class="border border-gray-300 w-full px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
</div>

<button
type="submit"
class="bg-blue-600 hover:bg-blue-700 text-white font-semibold w-full py-2 rounded-lg transition duration-200 shadow-md">

Login

</button>

<div class="mt-4 text-center">
<a href="#" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Forgot your password?</a>
</div>

</form>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
